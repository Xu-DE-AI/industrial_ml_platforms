apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoscale-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geoscale-api
  template:
    metadata:
      labels:
        app: geoscale-api
    spec:
      containers:
        - name: api
          image: geoscale-api:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: geoscale-api
spec:
  selector:
    app: geoscale-api
  ports:
    - port: 80
      targetPort: 8000
